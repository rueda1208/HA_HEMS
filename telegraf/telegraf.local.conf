[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "60s"
  omit_hostname = true

[[inputs.http]]
  urls = ["${BASE_HA_URL}/api/states"]
  method = "GET"
  headers = { "Authorization" = "Bearer ${SUPERVISOR_TOKEN}" }
  data_format = "json"
  json_query = "#(entity_id%\"climate.*\")#.{device_id:entity_id,attributes:{setpoint:attributes.temperature,temperature:attributes.current_temperature,state:attributes.hvac_action,fan_modes:attributes.fan_modes}}"
  json_string_fields = ["attributes_state"]
  tag_keys = ["device_id"]
  name_override = "space_heating"
  tags = { metric_type = "measure", input_type = "climate" }
  tagexclude = ["url"]

[[outputs.postgresql]]
  connection = "${POSTGRES_CONNECTION}"

[[processors.starlark]]
  source = '''
def apply(metric):
  if metric.tags.get("input_type", "none") != "climate":
    return metric

  metrics = []
  for key, value in metric.fields.items():
    device_id = metric.tags.get("device_id")
    if not device_id or key not in ["attributes_setpoint", "attributes_temperature"]:
      continue

    metric2 = Metric(metric.name)
    metric2.time = metric.time
    metric2.tags["metric_type"] = "measure"
    metric2.tags["device_id"] = device_id
    metric2.fields["name"] = key.removeprefix("attributes_")
    metric2.fields["value"] = value
    metrics.append(metric2)
  return metrics
'''
